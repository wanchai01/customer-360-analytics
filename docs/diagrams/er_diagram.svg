<svg viewBox="0 0 1050 700" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>
  <style>
    .dim { fill:#eafaf0; stroke:#2f9e5e; stroke-width:1.5; }
    .fact { fill:#eef4fb; stroke:#3b6ea5; stroke-width:2; }
    .gold { fill:#f5eefc; stroke:#7a4fb0; stroke-width:1.5; }
    .title { font-size:13px; font-weight:bold; text-anchor:middle; }
    .col { font-size:10.5px; text-anchor:start; }
    .pk { font-weight:bold; }
    .rel { stroke:#888; stroke-width:1.3; fill:none; marker-end:url(#arrow2); }
  </style>

  <text x="525" y="26" text-anchor="middle" font-size="19" font-weight="bold">Star Schema — Entity Relationship Diagram</text>

  <!-- FACT ORDERS (center) -->
  <rect class="fact" x="430" y="280" width="190" height="115" rx="6"/>
  <text class="title" x="525" y="298">fact_orders</text>
  <text class="col" x="440" y="315"><tspan class="pk">order_key (PK)</tspan></text>
  <text class="col" x="440" y="329">order_id</text>
  <text class="col" x="440" y="343">customer_key (FK)</text>
  <text class="col" x="440" y="357">order_date_key (FK)</text>
  <text class="col" x="440" y="371">order_status, total_amount</text>
  <text class="col" x="440" y="385">payment_method</text>

  <!-- dim_customer (left) -->
  <rect class="dim" x="60" y="260" width="190" height="130" rx="6"/>
  <text class="title" x="155" y="278">dim_customer</text>
  <text class="col" x="70" y="295"><tspan class="pk">customer_key (PK)</tspan></text>
  <text class="col" x="70" y="309">customer_id, full_name</text>
  <text class="col" x="70" y="323">email, gender, date_of_birth</text>
  <text class="col" x="70" y="337">location_key (FK)</text>
  <text class="col" x="70" y="351">registration_date</text>
  <text class="col" x="70" y="365">customer_status</text>

  <!-- dim_location -->
  <rect class="dim" x="60" y="80" width="170" height="80" rx="6"/>
  <text class="title" x="145" y="98">dim_location</text>
  <text class="col" x="70" y="115"><tspan class="pk">location_key (PK)</tspan></text>
  <text class="col" x="70" y="129">city, province, country</text>

  <!-- dim_date -->
  <rect class="dim" x="430" y="80" width="190" height="100" rx="6"/>
  <text class="title" x="525" y="98">dim_date</text>
  <text class="col" x="440" y="115"><tspan class="pk">date_key (PK)</tspan></text>
  <text class="col" x="440" y="129">full_date, year, quarter, month</text>
  <text class="col" x="440" y="143">day_name, is_weekend</text>

  <!-- dim_product -->
  <rect class="dim" x="800" y="260" width="190" height="120" rx="6"/>
  <text class="title" x="895" y="278">dim_product</text>
  <text class="col" x="810" y="295"><tspan class="pk">product_key (PK)</tspan></text>
  <text class="col" x="810" y="309">product_id, product_name</text>
  <text class="col" x="810" y="323">category, subcategory, brand</text>
  <text class="col" x="810" y="337">cost, selling_price</text>
  <text class="col" x="810" y="351">margin_pct (generated)</text>

  <!-- fact_order_items -->
  <rect class="fact" x="800" y="440" width="190" height="110" rx="6"/>
  <text class="title" x="895" y="458">fact_order_items</text>
  <text class="col" x="810" y="475"><tspan class="pk">order_item_key (PK)</tspan></text>
  <text class="col" x="810" y="489">order_key (FK)</text>
  <text class="col" x="810" y="503">product_key (FK)</text>
  <text class="col" x="810" y="517">quantity, unit_price, discount</text>
  <text class="col" x="810" y="531">line_amount (generated)</text>

  <!-- fact_payments -->
  <rect class="fact" x="430" y="440" width="190" height="95" rx="6"/>
  <text class="title" x="525" y="458">fact_payments</text>
  <text class="col" x="440" y="475"><tspan class="pk">payment_key (PK)</tspan></text>
  <text class="col" x="440" y="489">order_key (FK)</text>
  <text class="col" x="440" y="503">payment_date_key (FK)</text>
  <text class="col" x="440" y="517">payment_status, amount</text>

  <!-- fact_support_tickets -->
  <rect class="fact" x="60" y="440" width="190" height="105" rx="6"/>
  <text class="title" x="155" y="458">fact_support_tickets</text>
  <text class="col" x="70" y="475"><tspan class="pk">ticket_key (PK)</tspan></text>
  <text class="col" x="70" y="489">customer_key (FK)</text>
  <text class="col" x="70" y="503">issue_type, priority, status</text>
  <text class="col" x="70" y="517">resolution_time</text>

  <!-- fact_website_events -->
  <rect class="fact" x="60" y="580" width="220" height="105" rx="6"/>
  <text class="title" x="170" y="598">fact_website_events</text>
  <text class="col" x="70" y="615"><tspan class="pk">event_key (PK)</tspan></text>
  <text class="col" x="70" y="629">customer_key, product_key, device_key (FK)</text>
  <text class="col" x="70" y="643">event_type, page, traffic_source</text>
  <text class="col" x="70" y="657">RANGE PARTITIONED by year</text>

  <!-- dim_campaign + fact_campaign_interactions -->
  <rect class="dim" x="800" y="580" width="120" height="70" rx="6"/>
  <text class="title" x="860" y="598">dim_campaign</text>
  <text class="col" x="808" y="615"><tspan class="pk">campaign_key</tspan></text>
  <text class="col" x="808" y="629">channel, budget</text>

  <rect class="fact" x="620" y="580" width="160" height="95" rx="6"/>
  <text class="title" x="700" y="598">fact_campaign</text>
  <text class="title" x="700" y="612">_interactions</text>
  <text class="col" x="630" y="628"><tspan class="pk">interaction_key</tspan></text>
  <text class="col" x="630" y="642">campaign_key, customer_key</text>
  <text class="col" x="630" y="656">interaction_type</text>

  <!-- Gold layer note -->
  <rect class="gold" x="330" y="620" width="70" height="60" rx="6"/>
  <text class="col" x="335" y="640" font-size="9">Gold layer</text>
  <text class="col" x="335" y="652" font-size="9">(customer_360,</text>
  <text class="col" x="335" y="664" font-size="9">RFM, CLV) keys</text>
  <text class="col" x="335" y="676" font-size="9">on customer_id</text>

  <!-- Relationships -->
  <path class="rel" d="M250,320 H430"/>
  <path class="rel" d="M155,260 V160"/>
  <path class="rel" d="M525,280 V180"/>
  <path class="rel" d="M620,330 H800"/>
  <path class="rel" d="M525,395 V440"/>
  <path class="rel" d="M155,390 V440"/>
  <path class="rel" d="M155,390 C 155,480 155,530 155,580"/>
  <path class="rel" d="M525,395 C 400,450 250,550 260,600"/>
  <path class="rel" d="M895,380 V440"/>
  <path class="rel" d="M525,395 C 650,420 750,440 800,470"/>
  <path class="rel" d="M155,390 C 400,450 600,550 620,610"/>
  <path class="rel" d="M780,620 H800"/>

  <text x="525" y="20" text-anchor="middle" font-size="1"></text>
</svg>
